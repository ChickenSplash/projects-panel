services:
    app:
        build: .
        container_name: project-panel
        hostname: project-panel
        # Published so you can still reach it directly at http://project-panel:3000.
        # Drop this block if the tunnel should be the only way in.
        ports:
            - '3000:3000'
        environment:
            APP_NAME: 'Projects Panel'
            APP_ENV: production
            APP_DEBUG: 'false'
            # Set this to the public tunnel URL, e.g. https://projects.example.com. It is only
            # used for links generated outside a request; normal requests use the forwarded host.
            APP_URL: '${APP_URL:-http://project-panel:3000}'
            APP_KEY: '${APP_KEY:-}'
            DB_CONNECTION: sqlite
            DB_DATABASE: /app/database/database.sqlite
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: sync
            # Contact form messages: readable by the account with ADMIN_EMAIL and mailed to it.
            # Until MAIL_MAILER=smtp is set, the mail only goes to the container log.
            ADMIN_EMAIL: '${ADMIN_EMAIL:-}'
            MAIL_MAILER: '${MAIL_MAILER:-log}'
            MAIL_SCHEME: smtps
            MAIL_HOST: smtp.gmail.com
            MAIL_PORT: 465
            MAIL_USERNAME: '${MAIL_USERNAME:-}'
            MAIL_PASSWORD: '${MAIL_PASSWORD:-}'
            MAIL_FROM_ADDRESS: '${MAIL_USERNAME:-hello@example.com}'
            MAIL_FROM_NAME: 'Portfolio'
            LOG_CHANNEL: stderr
        volumes:
            - database:/app/database
        networks:
            - edge
        restart: unless-stopped

volumes:
    database:

networks:
    # Created by the cloudflared stack. Point the tunnel's public hostname at
    # http://project-panel:3000 -- cloudflared resolves that name on this network.
    edge:
        name: edge
        external: true
